# Model registry. Every endpoint speaks OpenAI-compatible chat/completions —
# that includes cloud providers and local vLLM.
#
# Each entry maps a *key* (referenced from other configs and run scripts) to
# the connection parameters for one endpoint.
# See `ModelConfig` in src/palimpsest/config.py for the full schema.

models:

  # ============================================================
  # Local vLLM endpoints — used by eval / factcheck (out of scope here)
  # ============================================================

  qwen3-4b-thinking:
    name: Qwen/Qwen3-4B-Thinking-2507
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    temperature: 0.7
    max_tokens: 16000

  translate_gemma-27b:
    name: Infomaniak-AI/vllm-translategemma-27b-it
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    temperature: 0.7
    max_tokens: 8192

  qwen3_6-27b:
    name: Qwen/Qwen3.6-27B
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    temperature: 0.7
    max_tokens: 20000
    extra_body:
      top_k: 20
      chat_template_kwargs:
        enable_thinking: True

  qwen3_5-397b:
    name: Qwen3-VL
    base_url: http://mercury.frontierai.ru:7080/v1
    api_key_env: QWEN_API_KEY
    temperature: 0.6
    top_p: 0.95
    max_tokens: 20000
    stream: True
    extra_body:
      top_k: 20
      chat_template_kwargs:
        enable_thinking: True

  # ============================================================
  # Anthropic — via CloseRouter (Anthropic-native /messages endpoint)
  # ============================================================
  #
  # `provider: anthropic` routes through the Anthropic SDK against the
  # CloseRouter base_url. Required because the OpenAI-compat bridge for
  # opus/sonnet drops or 502s on tool-call (litellm transform_response bug),
  # and `response_format` / OpenRouter-style `reasoning.effort` are silently
  # ignored for Claude models on this proxy. The SDK path lets us force
  # tool-call for structured output and use native `thinking` blocks.
  #
  # `*-low` / `*-high` variants intentionally dropped: `reasoning.effort` is
  # a no-op for Anthropic on CloseRouter. Extended thinking is left out of
  # yaml until we can verify it engages server-side — see docs/known_issues.md.
  # temperature: 0.0 for deterministic scoring; works on all three models
  # (chat and messages endpoint both declare temperature in supported_parameters).

  claude-haiku-4.5:
    name: anthropic/claude-haiku-4.5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    provider: anthropic
    supports_structured_output: true
    temperature: 0.0
    max_tokens: 16384

  # ============================================================
  # Google Gemini — via CloseRouter
  # ============================================================
  #
  # `google/gemini-3.1-flash-lite` (without `-preview`) is NOT exposed by
  # CloseRouter — only the `-preview` variant. `-low`/`-high` variants are
  # dropped because `reasoning.effort` is silently ignored on this proxy
  # (Gemini Pro: 513/573/511 reasoning_tokens for plain/low/high — noise).
  # Aliases for effort control don't exist for Gemini on this proxy either.
  # temperature: 1.0 follows Google's own guidance for Gemini 3 models.

  gemini-3.1-flash-lite-preview:
    name: google/gemini-3.1-flash-lite-preview
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  # ============================================================
  # OR-routed translation/eval models (large)
  # base_url is OpenRouter; the OPENROUTER_BASE_URL env var may
  # transparently override at runtime without ever appearing in yaml.
  # ============================================================
  #
  # OpenAI GPT entries use Router `custom-*-{low|medium|high|xhigh}`
  # aliases because on this proxy the OpenRouter-style `reasoning.effort`
  # body field is silently dropped — aliases are the only reliable control
  # surface. xhigh has no body-param equivalent.

  gpt-5.4-mini:
    name: openai/custom-gpt-5.4-mini-low
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  gpt-5.4-mini-low:
    name: openai/custom-gpt-5.4-mini-low
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  gpt-5.4-mini-high:
    name: openai/custom-gpt-5.4-mini-high
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  gpt-5.4:
    name: openai/custom-gpt-5.4-low
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  gpt-5.4-low:
    name: openai/custom-gpt-5.4-low
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  gpt-5.4-high:
    name: openai/custom-gpt-5.4-high
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  # gpt-5.5* omits `temperature`: CloseRouter's chat endpoint for this model
  # does not declare it in `supported_parameters` (request accepted, value
  # silently dropped); OpenAI's direct reasoning endpoint rejects it outright.

  gpt-5.5:
    name: openai/custom-gpt-5.5-low
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    max_tokens: 16384

  gpt-5.5-low:
    name: openai/custom-gpt-5.5-low
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    max_tokens: 16384

  gpt-5.5-high:
    name: openai/custom-gpt-5.5-high
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    max_tokens: 16384

  # `xhigh` is the only way to access the highest reasoning effort for gpt-5.5
  # (≈128 reasoning tokens vs ~40 default); no body-param `reasoning.effort`
  # value reaches it.
  gpt-5.5-xhigh:
    name: openai/custom-gpt-5.5-xhigh
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    max_tokens: 16384

# ----------------------------------------------

  claude-opus-4.7:
    name: anthropic/claude-opus-4.7
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    provider: anthropic
    supports_structured_output: true
    temperature: 0.0
    max_tokens: 16384

  claude-sonnet-4.6:
    name: anthropic/claude-sonnet-4.6
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    provider: anthropic
    supports_structured_output: true
    temperature: 0.0
    max_tokens: 16384

  gemini-3.1-pro:
    name: google/gemini-3.1-pro-preview
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  # ============================================================
  # Qwen — via CloseRouter
  # ============================================================
  #
  # `qwen/qwen3.6-flash` is NOT exposed by CloseRouter (404). Only
  # `qwen3.6-plus` is reachable. Its chat endpoint declares neither `top_k`
  # nor `min_p` (so the Qwen3 model-card non-thinking sampling recipe is
  # out of reach here), and `reasoning.enabled: false` does NOT disable
  # always-on thinking on this proxy — every call burns ~700-1500 reasoning
  # tokens before producing content. Kept as a fallback judge for scoring;
  # avoid for cost-sensitive translation runs.

  qwen3.6-plus:
    name: qwen/qwen3.6-plus
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 0.7
    top_p: 0.8
    max_tokens: 16384

  # ============================================================
  # DeepSeek — via CloseRouter
  # ============================================================
  #
  # `reasoning.effort` (nested under extra_body) works monotonically on
  # DeepSeek-v4-pro on this proxy: 164 / 387 / 578 reasoning_tokens for
  # plain / low / high.

  deepseek-v4-pro:
    name: deepseek/deepseek-v4-pro
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384

  deepseek-v4-pro-low:
    name: deepseek/deepseek-v4-pro
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low

  deepseek-v4-pro-high:
    name: deepseek/deepseek-v4-pro
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 1.0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: high

  # ============================================================
  # Z.ai GLM — via OpenRouter
  # ============================================================
  #
  # Top-level `reasoning_effort` works monotonically on GLM 5.1 on this
  # proxy: 310 → 525 reasoning_tokens for low → high.

  glm-5.1:
    name: z-ai/glm-5.1
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 0.7
    max_tokens: 16384

  glm-5.1-low:
    name: z-ai/glm-5.1
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 0.7
    max_tokens: 16384
    reasoning_effort: low

  glm-5.1-high:
    name: z-ai/glm-5.1
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_structured_output: true
    temperature: 0.7
    max_tokens: 16384
    reasoning_effort: high
