# Large-low profile: 3 large judges in -low effort, v1 variant prompts.
base_dir: data/pilot
prompts_variant: v1
max_concurrency: 32
judges:
  # `-low` effort variants for Claude/Gemini dropped from models.yaml — proxy
  # ignores `reasoning.effort` for these providers (no-op). Canonical entries
  # used here; the legacy `_par_by_par` run folder names below preserve the
  # historical naming used during translation.
  - model: claude-opus-4.7
  - model: gemini-3.1-pro
  - model: gpt-5.5-low
runs:
  - large/claude-opus-4.7-low_par_by_par
  - large/gpt-5.5-low_par_by_par
  - large/gemini-3.1-pro-low_par_by_par
