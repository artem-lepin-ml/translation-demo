# Focused scoring pass: single judge (gpt-5.5-low), v1 prompts, two pilot
# translations, all non-marker paragraphs. Factcheck off (default).
base_dir: data/pilot
prompts_variant: v1
max_concurrency: 32
judges:
  - model: gpt-5.5-low
runs:
  - local/qwen_edited_par_by_par
  - large/claude-opus-4.7_par_by_par
