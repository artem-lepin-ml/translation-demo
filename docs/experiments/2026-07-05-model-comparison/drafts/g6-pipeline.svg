lvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#555555" text-anchor="middle" style="">red · terminal, no judge call</text><line x1="372" y1="638" x2="700" y2="638" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="536.0" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.3" font-weight="400" fill="#6b6b6b" text-anchor="middle" style="font-style:italic;">empty</text><line x1="280" y1="684" x2="280" y2="836" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="288" y="769.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#6b6b6b" text-anchor="start" style="font-style:italic;">candidates found</text><rect x="75" y="790" width="420" height="354" rx="10" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4" stroke-dasharray="6,4"/><text x="92" y="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a" text-anchor="start" style="letter-spacing:0.5px;">STAGE 2</text><text x="92" y="826" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start" style="">Exact match</text><rect x="100.0" y="836" width="360" height="48" rx="8" fill="#fbfbfb" stroke="#7a7a7a" stroke-width="1.5"/><text x="280" y="865.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" style="">label_ru exact match (first)</text><line x1="280" y1="884" x2="280" y2="934" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/><text x="326" y="913.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#555555" text-anchor="start" style="font-style:italic;">no label match</text><rect x="100.0" y="934" width="360" height="48" rx="8" fill="#fbfbfb" stroke="#7a7a7a" stroke-width="1.5"/><text x="280" y="96