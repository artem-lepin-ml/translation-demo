[project]
name = "palimpsest"
version = "0.1.0"
description = "LLM-assisted translation of the Great Soviet Encyclopedia (RU -> EN)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pymupdf4llm>=0.0.17",
    "tqdm>=4.66",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "wikipedia-api>=0.7",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Pilot PDF-parser comparison (GPU hosts). Each extra is independent.
pilot-docling = ["docling>=2.0"]
pilot-mineru = ["magic-pdf>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
